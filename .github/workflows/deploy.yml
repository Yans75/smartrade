name: Deploy to Cloudflare Workers

# Se lance automatiquement à chaque push sur main (déploiement continu), ou
# manuellement depuis l'onglet Actions ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm ci avec un lockfile figé s'est révélé peu fiable pour la
      # dépendance native optionnelle de rolldown (bug npm connu :
      # https://github.com/npm/cli/issues/4828). npm install la résout
      # fraîchement à chaque run ; le force-install ci-dessous est un
      # filet de sécurité si l'auto-détection de plateforme se trompe
      # quand même (musl au lieu de gnu, observé une fois en test).
      - run: npm install
      - run: npm install --no-save @rolldown/binding-linux-x64-gnu

      # Les variables VITE_* sont lues au build (elles finissent dans le
      # bundle client) — le reste est lu au runtime par le Worker.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Configure les secrets du Worker
        working-directory: .output/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          printf '%s' "${{ secrets.SUPABASE_URL }}" | npx wrangler secret put SUPABASE_URL
          printf '%s' "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" | npx wrangler secret put SUPABASE_PUBLISHABLE_KEY
          printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          printf '%s' "${{ secrets.DEEPSEEK_API_KEY }}" | npx wrangler secret put DEEPSEEK_API_KEY
          printf '%s' "${{ secrets.DEEPSEEK_MODEL }}" | npx wrangler secret put DEEPSEEK_MODEL

      - name: Déploie
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx nitro deploy --prebuilt
